name: jenkins-cicd
services:
  jenkins:
    image: jenkins/jenkins:alpine
    restart: unless-stopped
    volumes:
      - jenkins_data:/var/jenkins_home
    ports:
      - 8082:8080
    networks:
      - jenkins_network
  jenkins-docker-agent:
    image: rawitath/jenkins-inbound-agent-docker:alpine
    restart: unless-stopped
    volumes:
      - jenkins_agent_data:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jenkins_network
    command: ["-webSocket", "-workDir=/home/jenkins/agent", "-url", "http://jenkins:8080", "${JENKINS_SECRET}", "docker-agent"]
volumes:
  jenkins_data:
  jenkins_agent_data:
networks:
  jenkins_network:
    driver: bridge